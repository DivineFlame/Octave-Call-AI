services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_ADMIN
    networks:
      - app-network
    volumes:
      - .:/workspaces/octave-call-ai:cached
      - octave-call-ai-venv:/workspaces/octave-call-ai/venv
      - octave-call-ai-ui-node_modules:/workspaces/octave-call-ai/ui/node_modules
      - octave-call-ai-ts-validator-node_modules:/workspaces/octave-call-ai/api/mcp_server/ts_validator/node_modules
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8000:8000"
volumes:
  octave-call-ai-venv:
  octave-call-ai-ui-node_modules:
  octave-call-ai-ts-validator-node_modules:
