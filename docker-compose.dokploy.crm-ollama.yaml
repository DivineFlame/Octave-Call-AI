services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  coturn:
    image: coturn/coturn:4.8.0
    restart: unless-stopped
    command:
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}
      - --realm=${TURN_HOST:?TURN_HOST is required}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49152
      - --max-port=49200
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    networks:
      - app-network

  api:
    image: "${REGISTRY:-divineflame}/octave-call-ai-api:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DEPLOYMENT_MODE: "${DEPLOYMENT_MODE:-oss}"
      AUTH_PROVIDER: "${AUTH_PROVIDER:-local}"
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:?BACKEND_API_ENDPOINT is required}"
      UI_APP_URL: "${UI_APP_URL:?UI_APP_URL is required}"
      FORWARDED_ALLOW_IPS: "*"
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      ENABLE_AWS_S3: "false"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      MINIO_BUCKET: "${MINIO_BUCKET:-voice-audio}"
      MINIO_SECURE: "false"
      TURN_HOST: "${TURN_HOST:?TURN_HOST is required}"
      TURN_SECRET: "${TURN_SECRET:?TURN_SECRET is required}"
      FORCE_TURN_RELAY: "${FORCE_TURN_RELAY:-false}"
      OSS_JWT_SECRET: "${OSS_JWT_SECRET:?OSS_JWT_SECRET is required}"
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-false}"
      FASTAPI_WORKERS: "${FASTAPI_WORKERS:-1}"
      MPS_API_URL: "${MPS_API_URL:-https://services.octave-call-ai.com}"
      OCTAVE_CALL_AI_MPS_SECRET_KEY: "${OCTAVE_CALL_AI_MPS_SECRET_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-}"
    volumes:
      - shared_tmp:/tmp
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network
      - ollama-network

  ui:
    image: "${REGISTRY:-divineflame}/octave-call-ai-ui:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      NODE_ENV: "production"
      NEXT_PUBLIC_NODE_ENV: "production"
      BACKEND_URL: "http://api:8000"
      NEXT_PUBLIC_BACKEND_URL: "${BACKEND_API_ENDPOINT:?BACKEND_API_ENDPOINT is required}"
      ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-false}"
    expose:
      - "3010"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3010 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  shared_tmp:

networks:
  app-network:
    driver: bridge
  ollama-network:
    name: "${SHARED_DOCKER_NETWORK:-octave-ai-network}"
    external: true
