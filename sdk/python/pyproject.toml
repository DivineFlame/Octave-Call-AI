[project]
name = "octave-call-ai-sdk"
version = "0.1.8"
description = "Typed builder for Octave-Call-AI voice-AI workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
authors = [
    { name = "Zansat Technologies Private Limited", email = "contact@octave-call-ai.com" },
]
keywords = ["octave-call-ai", "voice-ai", "workflow", "sdk", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/DivineFlame/Octave-Call-AI"
Documentation = "https://github.com/DivineFlame/Octave-Call-AI/tree/main/docs"
Repository = "https://github.com/DivineFlame/Octave-Call-AI"

[project.scripts]
octave-call-ai-sdk-codegen = "octave_call_ai_sdk.codegen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octave_call_ai_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
